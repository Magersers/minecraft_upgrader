name: Fabric builds and server checks
on:
  push:
    branches: [main]
    paths: ['fabric/**', 'src/main/java/dev/upgrade/core/**', 'src/test/**', 'src/main/resources/data/**', '.github/workflows/fabric.yml']
  pull_request:
    paths: ['fabric/**', 'src/main/java/dev/upgrade/core/**', 'src/test/**', 'src/main/resources/data/**', '.github/workflows/fabric.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.20.1', '1.21.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify economy
        run: ./gradlew -p fabric -Pminecraft_version=${{ matrix.minecraft }} build --console=plain
      - name: Prepare isolated test world
        run: |
          mkdir -p fabric/run/${{ matrix.minecraft }}/test-server
          echo eula=true > fabric/run/${{ matrix.minecraft }}/test-server/eula.txt
          printf 'online-mode=false\nserver-port=0\nlevel-type=minecraft:flat\nspawn-protection=0\n' > fabric/run/${{ matrix.minecraft }}/test-server/server.properties
      - name: Real dedicated-server integration tests
        timeout-minutes: 10
        run: ./gradlew -p fabric -Pminecraft_version=${{ matrix.minecraft }} runTestServer --console=plain
      - name: Render and verify all 22 languages at normal and compact sizes
        timeout-minutes: 15
        run: xvfb-run -a ./gradlew -p fabric -Pminecraft_version=${{ matrix.minecraft }} -Dupgrade.testLanguages=ar_sa,de_de,en_us,es_es,es_mx,fr_fr,hi_in,id_id,it_it,ja_jp,ko_kr,nl_nl,pl_pl,pt_br,pt_pt,ru_ru,th_th,tr_tr,uk_ua,vi_vn,zh_cn,zh_tw runTestClient --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          retention-days: 3
          name: localization-screenshots-${{ matrix.minecraft }}
          path: |
            fabric/run/${{ matrix.minecraft }}/test-client/screenshots/*.png
            fabric/run/${{ matrix.minecraft }}/test-client/upgrade-ui-passed.txt
            fabric/run/${{ matrix.minecraft }}/test-client/logs/latest.log
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: upgrade-fabric-${{ matrix.minecraft }}
          path: fabric/build/${{ matrix.minecraft }}/libs/upgrade-fabric-${{ matrix.minecraft }}-0.6.5.jar
