name: Unified release verification
on:
  workflow_dispatch:
  push:
    tags: ['v0.9.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: fabric, minecraft: '1.20.1', java: '17', loader: fabric}
          - {project: fabric, minecraft: '1.21.1', java: '21', loader: fabric}
          - {project: forge, minecraft: '1.19.2', java: '17', loader: forge}
          - {project: forge, minecraft: '1.20.1', java: '17', loader: forge}
          - {project: neoforge, minecraft: '1.21', java: '21', loader: neoforge}
          - {project: neoforge, minecraft: '1.21.1', java: '21', loader: neoforge}
          - {project: modern/fabric, minecraft: '26.3', java: '25', loader: fabric}
          - {project: modern/forge, minecraft: '26.3', java: '25', loader: forge}
          - {project: modern/neoforge, minecraft: '26.3', java: '25', loader: neoforge}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build production archive and assertion suites
        shell: bash
        run: |
          if [[ '${{ matrix.minecraft }}' == '26.3' ]]; then
            cd modern
            chmod +x gradlew
            ./gradlew -p '${{ matrix.loader }}' clean build --console=plain
          else
            chmod +x gradlew
            ./gradlew -p '${{ matrix.project }}' -Pminecraft_version='${{ matrix.minecraft }}' clean build --console=plain
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: ${{ matrix.project }}/build/**/libs/upgrade-${{ matrix.loader }}-${{ matrix.minecraft }}-0.9.0.jar
          if-no-files-found: error
  archives:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify all nine archives
        run: python scripts/verify-release.py release
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-0.9.0
          path: release/*
