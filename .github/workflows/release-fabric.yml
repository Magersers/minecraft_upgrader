name: Release Fabric 0.4
on:
  workflow_dispatch:
  push:
    branches: [codex/upgrader-economy-ui]
    paths: [.github/workflows/release-fabric.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test both Minecraft versions
        timeout-minutes: 20
        run: |
          mkdir -p release
          for mc in 1.20.1 1.21.1; do
            mkdir -p "fabric/run/$mc/test-server"
            echo eula=true > "fabric/run/$mc/test-server/eula.txt"
            printf 'online-mode=false\nserver-port=0\nlevel-type=minecraft:flat\nview-distance=2\nsimulation-distance=2\n' > "fabric/run/$mc/test-server/server.properties"
            ./gradlew -p fabric -Pminecraft_version="$mc" build runTestServer --console=plain
            cp "fabric/build/$mc/libs/upgrade-fabric-$mc-0.4.0-alpha.jar" release/
          done
          (cd release && sha256sum *.jar > SHA256SUMS.txt)
      - name: Publish Fabric files and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create fabric-v0.4.0-alpha release/*.jar release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'Upgrader Fabric 0.4.0-alpha — 1.20.1 / 1.21.1' \
            --notes-file docs/releases/fabric-0.4.0.md --prerelease
