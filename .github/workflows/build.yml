name: Build and recipe tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test in Forge
        run: ./gradlew build runGameTestServer --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: upgrade-forge-1.20.1
          path: build/libs/upgrade-*.jar
