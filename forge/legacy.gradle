// Compile the same gameplay sources against 1.19.2's pre-1.20 names.
ext.legacyLine = { String line ->
    line.replace('import net.minecraft.core.registries.BuiltInRegistries;', 'import net.minecraft.core.Registry;')
        .replace('import net.minecraft.core.registries.Registries;', 'import net.minecraft.core.Registry;')
        .replace('import net.minecraft.core.registries.*;', 'import net.minecraft.core.Registry;')
        .replace('net.minecraft.core.registries.BuiltInRegistries.', 'net.minecraft.core.Registry.')
        .replace('BuiltInRegistries.', 'Registry.')
        .replace('Registries.ITEM', 'Registry.ITEM_REGISTRY')
        .replace('Registries.CONFIGURED_FEATURE', 'Registry.CONFIGURED_FEATURE_REGISTRY')
        .replace('org.joml.Matrix4f', 'com.mojang.math.Matrix4f')
        .replace('getResultItem(server.registryAccess())', 'getResultItem()')
        .replace('net.minecraft.world.level.storage.loot.LootParams', 'net.minecraft.world.level.storage.loot.LootContext')
        .replace('new LootParams.Builder', 'new LootContext.Builder')
        .replace('BuiltInRegistries', 'Registry')
        .replace('Registry.ITEM.get(Ids.of(drop.getKey())) instanceof SmithingTemplateItem', 'false')
        .replace('Registry.ITEM.get(Ids.of(id)) instanceof SmithingTemplateItem', 'false')
        .replace('item instanceof SmithingTemplateItem', 'false')
        .replace('stack.is(Items.PINK_PETALS)||', '')
        .replace(' || b.getBlock() instanceof PinkPetalsBlock', '')
        .replace(' || block instanceof PinkPetalsBlock', '')
        .replace('armor.getEquipmentSlot()', 'armor.getSlot()')
        .replace('getLanguageManager().getSelected()', 'getLanguageManager().getSelected().getCode()')
        .replace('action::accept', 'b -> action.accept((Button)b)')
        .replace('SmithingTransformRecipe', 'UpgradeRecipe')
        .replace('table.getRandomItems(params,0x52FA1234L+i*104729L)', 'table.getRandomItems(builder.withRandom(net.minecraft.util.RandomSource.create(0x52FA1234L+i*104729L)).create(LootContextParamSets.BLOCK))')
        .replace('net.minecraft.world.item.Items.PINK_PETALS','net.minecraft.world.item.Items.DANDELION')
        .replace('SoundEvents.NOTE_BLOCK_HAT.value()', 'SoundEvents.NOTE_BLOCK_HAT')
        .replace('net.minecraft.client.gui.GuiGraphics', 'dev.upgrade.client.legacy.GuiGraphics')
        .replace('import net.minecraft.client.gui.components.Button;', 'import dev.upgrade.client.legacy.Button;')
        .replace('net.minecraft.client.gui.components.Tooltip', 'dev.upgrade.client.legacy.Tooltip')
        .replace('search.setHint(t(text("upgrade.search_hint")));', '')
        .replace('event.getGuiGraphics()', 'new dev.upgrade.client.legacy.GuiGraphics(event.getPoseStack())')
        .replace('mc.getLanguageManager().setSelected(language())', 'mc.getLanguageManager().setSelected(mc.getLanguageManager().getLanguage(language()))')
        .replace('ctx.getSource().sendSuccess(()->', 'ctx.getSource().sendSuccess(')
}
