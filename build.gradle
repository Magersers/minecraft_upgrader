plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'dev.upgrade'
version = '0.1.1-alpha'
base { archivesName = 'upgrade' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy 'reobfJar'
tasks.register('coreTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.upgrade.core.CostEngineTest'
}
check.dependsOn coreTest
